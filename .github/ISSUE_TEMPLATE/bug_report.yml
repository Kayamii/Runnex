name: Bug report
description: Report something that does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include tokens, private keys or other credentials** — redact them from logs.
        Security vulnerabilities must be reported privately; see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `runnex ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Runnex version
      description: Output of `runnex version`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Ubuntu 24.04, arm64, installed from release binary

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with secrets redacted.
      render: text
